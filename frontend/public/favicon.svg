<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Top Highlight -->
  <path d="M 0 128 C 0 57.28 57.28 0 128 0 L 384 0 C 454.72 0 512 57.28 512 128 C 512 180 400 120 256 120 C 112 120 0 180 0 128 Z" fill="#ffffff" opacity="0.08" />

  <!-- White Sheet / Clipboard -->
  <g filter="url(#shadow)">
    <rect x="110" y="120" width="292" height="300" rx="28" fill="#ffffff" />
    
    <!-- Top Clip Holder -->
    <rect x="186" y="86" width="140" height="64" rx="18" fill="#4338ca" />
    <rect x="222" y="104" width="68" height="20" rx="8" fill="#ffffff" opacity="0.3" />
    
    <!-- Sheet Lines / Items -->
    <rect x="160" y="196" width="192" height="18" rx="9" fill="#c7d2fe" />
    <circle cx="172" cy="205" r="7" fill="#4f46e5" />

    <rect x="160" y="244" width="192" height="18" rx="9" fill="#c7d2fe" />
    <circle cx="172" cy="253" r="7" fill="#10b981" />

    <rect x="160" y="292" width="110" height="18" rx="9" fill="#e0e7ff" />
    <circle cx="172" cy="301" r="7" fill="#f59e0b" />
  </g>

  <!-- Green Success Badge with Checkmark -->
  <g filter="url(#shadow)">
    <circle cx="360" cy="370" r="72" fill="#ffffff" />
    <circle cx="360" cy="370" r="62" fill="url(#badgeGrad)" />
    <!-- Checkmark -->
    <path d="M 334 372 L 352 390 L 388 350" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>